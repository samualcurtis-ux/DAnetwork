<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1722; color: #e0e0e0; }
#map { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
#header { position: fixed; top: 0; left: 0; right: 0; height: 70px; background: rgba(15, 23, 42, 0.98); border-bottom: 1px solid rgba(100, 150, 200, 0.2); z-index: 1000; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; backdrop-filter: blur(4px); }
#header-left { display: flex; flex-direction: column; gap: 2px; }
#header-title { font-size: 18px; font-weight: 600; color: #fff; }
#header-subtitle { font-size: 11px; color: #8ab; }
#header-center { display: flex; gap: 8px; }
.tab-btn { padding: 10px 16px; border: none; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 600; background: rgba(60, 80, 120, 0.4); color: #aaa; transition: all 0.2s; border: 1px solid transparent; }
.tab-btn:hover { background: rgba(80, 100, 140, 0.6); color: #ccc; }
.tab-btn.active { color: #fff; border: 1px solid rgba(255, 255, 255, 0.3); }
.tab-btn.active.current { background: #e74c3c; }
.tab-btn.active.optimized { background: #27ae60; }
.tab-btn.active.corrected { background: #e67e22; }
.tab-btn.active.neilHybrid { background: #f39c12; }
    .tab-btn.active.neilOptimistic { background: #1abc9c; }
    .tab-btn.active.hybridArch { background: #e91e63; }
.tab-btn.active.welinkPrelim { background: #ff6f00; }
.legend-triangle { width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-bottom:10px solid #ff6f00; display:inline-block; }
#header-right { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.kpi-badge { padding: 6px 12px; border-radius: 16px; font-size: 11px; font-weight: 600; background: rgba(100, 100, 150, 0.4); color: #ddd; border: 1px solid rgba(150, 150, 200, 0.3); }
.kpi-badge.green { background: rgba(39, 174, 96, 0.3); color: #2ecc71; border-color: rgba(46, 204, 113, 0.4); }
.kpi-badge.blue { background: rgba(52, 152, 219, 0.3); color: #3498db; border-color: rgba(52, 152, 219, 0.4); }
.kpi-badge.red { background: rgba(231, 76, 60, 0.3); color: #e74c3c; border-color: rgba(231, 76, 60, 0.4); }
.kpi-badge.orange { background: rgba(230, 126, 34, 0.3); color: #e67e22; border-color: rgba(230, 126, 34, 0.4); }
#bottom-left { position: fixed; bottom: 20px; left: 20px; z-index: 999; width: 320px; max-height: 70vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.panel { background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(100, 150, 200, 0.2); border-radius: 8px; padding: 16px; backdrop-filter: blur(4px); }
.panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.panel-title { font-size: 14px; font-weight: 600; color: #fff; }
.collapse-btn { font-size: 11px; color: #66b; cursor: pointer; text-decoration: underline; }
#econ-panel { max-height: 400px; overflow-y: auto; }
.econ-section { margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid rgba(100, 150, 200, 0.1); }
.econ-section:last-child { border-bottom: none; }
.econ-label { font-size: 10px; font-weight: 700; color: #b8a; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.econ-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px; color: #ccc; }
.econ-val { color: #fff; font-weight: 500; }
.econ-val.positive { color: #2ecc71; }
.econ-val.negative { color: #e74c3c; }
.econ-bar-container { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
.econ-bar { flex: 1; height: 20px; background: rgba(100, 100, 150, 0.2); border-radius: 4px; overflow: hidden; }
.econ-bar-fill { height: 100%; border-radius: 4px; }
#legend-panel { max-height: 300px; overflow-y: auto; }
.legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding: 4px; border-radius: 4px; }
.legend-item:hover { background: rgba(100, 120, 160, 0.15); }
.legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
.legend-rect { width: 12px; height: 12px; flex-shrink: 0; border-radius: 2px; }
.legend-diamond { width: 10px; height: 10px; flex-shrink: 0; transform: rotate(45deg); border: 2px solid #fff; }
.legend-dash { width: 20px; height: 0; flex-shrink: 0; border-top: 2px dashed; }
.legend-ring { width: 12px; height: 12px; flex-shrink: 0; border-radius: 50%; border: 2px solid; background: transparent; }
.legend-label { font-size: 12px; color: #ccc; flex: 1; }
.legend-count { font-size: 11px; color: #888; }
.legend-item input[type="checkbox"] { accent-color: #3498db; cursor: pointer; width: 16px; height: 16px; }
#sites-panel { max-height: 400px; overflow-y: auto; }
.sites-table { width: 100%; font-size: 11px; border-collapse: collapse; }
.sites-table thead { background: rgba(100, 120, 160, 0.2); position: sticky; top: 0; }
.sites-table th { padding: 6px 4px; text-align: left; font-weight: 600; color: #8ab; border-bottom: 1px solid rgba(100, 150, 200, 0.2); }
.sites-table td { padding: 5px 4px; color: #ccc; border-bottom: 1px solid rgba(100, 150, 200, 0.1); }
.sites-table tr:hover { background: rgba(100, 120, 160, 0.1); }
#bottom-right { position: fixed; bottom: 20px; right: 20px; z-index: 999; width: 360px; max-height: 70vh; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: rgba(100, 120, 160, 0.1); border-radius: 3px; }
::-webkit-scrollbar-thumb { background: rgba(100, 150, 200, 0.3); border-radius: 3px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="header">
    <div id="header-left">
        <div id="header-title">WeLink BEAD Network Design</div>
        <div id="header-subtitle">Arizona - Maricopa County</div>
    </div>
    <div id="header-center">
        <button class="tab-btn current active" onclick="switchTab('current')">Current Design</button>
        <button class="tab-btn corrected" onclick="switchTab('corrected')">Corrected Design</button>
        <button class="tab-btn optimized" onclick="switchTab('optimized')">Optimized Design</button>
        <button class="tab-btn neilHybrid" onclick="switchTab('neilHybrid')">Neil Hybrid</button>
        <button class="tab-btn neilOptimistic" onclick="switchTab('neilOptimistic')">Neil Optimistic</button>
        <button class="tab-btn hybridArch" onclick="switchTab('hybridArch')">Hybrid Architecture</button>
<button class="tab-btn welinkPrelim" onclick="switchTab('welinkPrelim')">WeLink Preliminary</button>
    </div>
    <div id="header-right">
        <div class="kpi-badge green"><span id="kpi-bsls">9,584 BSLs (84.5%)</span></div>
        <div class="kpi-badge blue"><span id="kpi-towers">6 Existing Fiber Sites</span></div>
        <div class="kpi-badge red"><span id="kpi-capex">$2.4M Infra CAPEX</span></div>
        <div class="kpi-badge orange"><span id="kpi-tech">12 Ketsen Gateways</span></div>
        <select id="basemap-select" onchange="switchBasemap(this.value)" style="padding:6px 10px;border-radius:16px;font-size:11px;font-weight:600;background:rgba(60,80,120,0.6);color:#ddd;border:1px solid rgba(150,150,200,0.3);cursor:pointer;outline:none;">
            <option value="dark" selected>Dark</option>
            <option value="light">Light</option>
            <option value="satellite">Satellite</option>
        </select>
    </div>
</div>
<div id="bottom-left">
    <div class="panel" id="econ-panel-wrapper">
        <div class="panel-header">
            <div class="panel-title" id="econ-title">Current Design Economics</div>
            <div class="collapse-btn" onclick="togglePanel('econ')">collapse</div>
        </div>
        <div id="econ-panel"></div>
    </div>
    <div class="panel" id="legend-panel-wrapper">
        <div class="panel-header">
            <div class="panel-title" id="legend-title">Current Design Layers</div>
            <div class="collapse-btn" onclick="togglePanel('legend')">collapse</div>
        </div>
        <div id="legend-panel"></div>
    </div>
</div>
<div id="bottom-right">
    <div class="panel" id="sites-panel-wrapper">
        <div class="panel-header">
            <div class="panel-title" id="sites-title">Existing Fiber Sites (6)</div>
            <div class="collapse-btn" onclick="togglePanel('sites')">collapse</div>
        </div>
        <div id="sites-panel"></div>
    </div>
</div>

    function renderHybridArch() {
        layers.design.clearLayers();
        // Only neil anchor sites (no infill needed - Ketsen PTMP handles leaf coverage)
        var anchors = neilHybridSites.filter(function(s){ return neilAnchorIds.indexOf(s.id) >= 0; });

        // Draw Ketsen PTP mesh links between nearest neighbors
        var meshLinks = [];
        anchors.forEach(function(a) {
            var dists = anchors.filter(function(b){return b.id !== a.id;}).map(function(b){
                var dlat = (b.lat - a.lat) * 111.32;
                var dlon = (b.lon - a.lon) * 111.32 * Math.cos(a.lat * Math.PI / 180);
                return {id: b.id, lat: b.lat, lon: b.lon, dist: Math.sqrt(dlat*dlat + dlon*dlon)};
            }).sort(function(x,y){return x.dist - y.dist;});
            // Connect to nearest 2 neighbors within 20km
            dists.slice(0, 2).forEach(function(n){
                if (n.dist < 20) {
                    var key = Math.min(a.id, n.id) + '-' + Math.max(a.id, n.id);
                    if (meshLinks.indexOf(key) < 0) {
                        meshLinks.push(key);
                        L.polyline([[a.lat, a.lon], [n.lat, n.lon]], {
                            color: '#e91e63', weight: 1.5, opacity: 0.6, dashArray: '8 5'
                        }).bindPopup('Ketsen PTP Mesh<br>' + n.dist.toFixed(1) + ' km').addTo(layers.design);
                    }
                }
            });
        });

        // Draw Ketsen PTMP coverage rings (2km radius) around each anchor
        anchors.forEach(function(s) {
            L.circle([s.lat, s.lon], {
                radius: 2000, color: '#e91e63', weight: 1, opacity: 0.3,
                fillOpacity: 0.08, fillColor: '#e91e63', dashArray: '4 3'
            }).addTo(layers.design);
        });

        // Draw G2 overlay coverage rings (5km radius)
        anchors.forEach(function(s) {
            L.circle([s.lat, s.lon], {
                radius: 5000, color: '#3498db', weight: 1, opacity: 0.15,
                fillOpacity: 0.04, fillColor: '#3498db'
            }).addTo(layers.design);
        });

        // Draw anchor site markers
        anchors.forEach(function(s) {
            var isColoc = s.type === 'ELNK' || s.type === 'ASR';
            if (isColoc) {
                var icon = L.divIcon({ className: '', html: '<div style="width:16px;height:16px;background:#e91e63;border:2px solid #fff;transform:rotate(45deg);box-shadow:0 0 8px rgba(233,30,99,0.8);"></div>', iconSize: [16,16], iconAnchor: [8,8] });
                L.marker([s.lat, s.lon], { icon: icon })
                    .bindPopup('<b>' + s.name + '</b><br>Type: ' + s.type + ' (Coloc)<br>BSLs: ' + s.bsls + '<br>Sectors: ' + s.sectors +
                        '<br><b>Overlay:</b> Tarana G2 (5km)' +
                        '<br><b>Underlay:</b> Ketsen PTMP (2km)' +
                        '<br><b>Backhaul:</b> Ketsen PTP Mesh')
                    .addTo(layers.design);
            } else {
                L.circleMarker([s.lat, s.lon], { radius: 8, color: '#e91e63', weight: 2, opacity: 1, fillOpacity: 0.9, fillColor: '#e91e63' })
                    .bindPopup('<b>' + s.name + '</b><br>Type: ' + s.type + ' (New Build)<br>BSLs: ' + s.bsls + '<br>Sectors: ' + s.sectors +
                        '<br><b>Overlay:</b> Tarana G2 (5km)' +
                        '<br><b>Underlay:</b> Ketsen PTMP (2km)' +
                        '<br><b>Backhaul:</b> Ketsen PTP Mesh')
                    .addTo(layers.design);
            }
        });
    }

            var infSites = welinkPrelimSites.filter(function(s){return s.src==='computed';}).sort(function(a,b){return (b.bsls||0)-(a.bsls||0);});
            sites = wlSites.map(function(s){
                return{label:s.name.length>22?s.name.substring(0,22)+'...':s.name,bsls:s.heightFt?s.heightFt+'ft':'--',sectors:s.structure||'--',type:s.type+' / '+s.city};
            }).concat(infSites.map(function(s){
                return{label:s.name,bsls:s.bsls||'--',sectors:'--',type:'Infill'};
            }));
            t.textContent = 'WeLink Preliminary Sites (' + sites.length + ')';
            showType = true;
            hdrOverride = '<th>SITE</th><th>HT/BSLS</th><th>STRUCT</th><th>TYPE</th>';
        }
        var hdr = hdrOverride ? hdrOverride : (showType ? '<th>SITE</th><th>BSLS</th><th>SEC</th><th>TYPE</th>' : '<th>SITE</th><th>BSLS</th><th>SEC</th><th>LAT</th><th>LON</th>');
        var rows = sites.slice(0,25).map(function(s){
            return showType ? '<tr><td>'+s.label+'</td><td>'+s.bsls+'</td><td>'+s.sectors+'</td><td>'+s.type+'</td></tr>' :
                '<tr><td>'+s.label+'</td><td>'+s.bsls+'</td><td>'+s.sectors+'</td><td>'+(s.lat?s.lat.toFixed(3):'')+'</td><td>'+(s.lon?s.lon.toFixed(3):'')+'</td></tr>';
        }).join('');
        p.innerHTML = '<table class="sites-table"><thead><tr>'+hdr+'</tr></thead><tbody>'+rows+'</tbody></table>';
    }
    window.renderSitesTable = renderSitesTable;

    function updateKPIs() {
        var m = scenarioMetrics[activeTab];
        document.getElementById('kpi-bsls').textContent = m.bslsServed.toLocaleString() + ' BSLs (' + m.bslsCovPct + ')';
        document.getElementById('kpi-towers').textContent = m.siteCount + ' ' + (activeTab === 'current' ? 'Fiber Sites' : 'Tower Sites');
        if (activeTab === 'optimized') {
            document.getElementById('kpi-towers').textContent = m.siteLabel;
        }
        document.getElementById('kpi-capex').textContent = m.infraCapex + ' Infra CAPEX';
        if (activeTab==='hybridArch') {
            document.getElementById('kpi-tech').textContent = 'G2 + Ketsen Hybrid';
            document.getElementById('kpi-towers').textContent = m.siteLabel;
        } else {
            document.getElementById('kpi-tech').textContent = m.ketsenCount + ' Ketsen Gateways';
        }
    }
    window.updateKPIs = updateKPIs;

    
function switchTab(tab) {
        activeTab = tab;
        document.querySelectorAll('.tab-btn').forEach(function(t){t.classList.remove('active');});
        document.querySelector('.tab-btn.'+tab).classList.add('active');
        if (tab==='current'){renderCurrent();}
        else if (tab==='corrected'){renderCorrected();}
        else if (tab==='optimized'){renderOptimized();}else if (tab==='neilHybrid'){renderNeilHybrid();}else if (tab==='neilOptimistic'){renderNeilOptimistic();}else if (tab==='hybridArch'){renderHybridArch();} else if(tab==='welinkPrelim'){renderWelinkPrelim();}
        renderCoverage();
        if (layerVisibility['design-sites']) layers.design.addTo(map);
        if (layerVisibility['coverage']) layers.coverage.addTo(map);
        var tabLabel = tab==='welinkPrelim' ? 'WeLink Preliminary' : tab==='neilHybrid' ? 'Neil Hybrid' : tab==='neilOptimistic' ? 'Neil Optimistic' : tab==='hybridArch' ? 'Hybrid Architecture' : tab.charAt(0).toUpperCase()+tab.slice(1);
        document.getElementById('econ-title').textContent=tabLabel+' Design Economics';
        document.getElementById('legend-title').textContent=tabLabel+' Design Layers';
        renderEconomics();renderSitesTable();renderLegend();updateKPIs();
    }
    window.switchTab = switchTab;

    function togglePanel(n) {
        var w = document.getElementById(n+'-panel-wrapper'); if(!w) return;
        var c = w.querySelector('[id$="-panel"]:not([id$="-wrapper"])');
        var b = w.querySelector('.collapse-btn');
        if (c.style.display==='none'){c.style.display='';b.textContent='collapse';}
        else{c.style.display='none';b.textContent='expand';}
    }
    window.togglePanel = togglePanel;

    renderCurrent(); layers.design.addTo(map);
    renderCoverage(); layers.coverage.addTo(map);
    renderLegend(); renderEconomics(); renderSitesTable(); updateKPIs();

    // QA validation
    (function qaCheck(){
        var m = scenarioMetrics[activeTab];
        var warnings = [];
        if (activeTab==='current' && fiberSites.length !== m.siteCount) warnings.push('Current siteCount ('+m.siteCount+') != fiberSites.length ('+fiberSites.length+')');
        if (activeTab==='corrected' && correctedSites.length !== m.siteCount) warnings.push('Corrected siteCount ('+m.siteCount+') != correctedSites.length ('+correctedSites.length+')');
        var phxAreas = salesAreas.filter(function(s){return s.info&&s.info['Sales Area Name']&&s.info['Sales Area Name'].indexOf('PHX1')===0;});
        var phxActive = phxAreas.filter(function(s){return s.info&&s.info['Sales Areas Status']==='Active';}).length;
        if (phxActive !== 48) warnings.push('PHX active sales areas != 48, got '+phxActive);
        warnings.forEach(function(w){console.warn('[QA] '+w);});
        if (!warnings.length) console.log('[QA] All checks passed');
    })();

    setTimeout(function(){map.invalidateSize();},100);
} catch(e) {
    console.error('Map error:',e);
    document.getElementById('map').innerHTML='<div style="color:red;padding:80px 20px;font-size:16px;">Map Error: '+e.message+'</div>';
}

</script>
</body>
</html>
